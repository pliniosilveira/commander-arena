name: Coverage report

# D-396: once a week (and on demand) runs the card pipeline over a fresh copy of Scryfall's
# oracle_cards file and publishes the result as a small site on GitHub Pages: the badge JSONs
# that the README draws, an image of the three shares, the full report and the ranked backlog.
# The repository's front page reads it from there, so it stays current without a pull request.
# Needs Settings -> Pages -> Source "GitHub Actions" (the owner sets it once). The `Coverage`
# workflow stays what it was: the check that a change does not lower the committed baseline.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coverage-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the card pipeline on a fresh bulk file
        run: pnpm coverage:cards --download --out .coverage --update-baseline
      - name: Build the site
        run: >
          node tools/corpus/coverage-badge-cli.ts
          --baseline .coverage/coverage-baseline.json
          --reports .coverage
          --out .coverage-site
          --date "$(date -u +%Y-%m-%d)"
      - name: Show the report in the job summary
        run: cat .coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: .coverage
          retention-days: 90
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .coverage-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
