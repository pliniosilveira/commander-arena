name: Coverage report

# D-410: once a week (and on demand) runs the card pipeline over a fresh copy of Scryfall's
# oracle_cards file and publishes the result as a small site on GitHub Pages: the badge JSONs
# that the README draws, an image of the three shares, the full report and the ranked backlog.
# The repository's front page reads it from there, so it stays current without a pull request.
# Needs Settings -> Pages -> Source "GitHub Actions" (the owner sets it once). The `Coverage`
# workflow stays what it was: the check that a change does not lower the committed baseline.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coverage-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the card pipeline on a fresh bulk file
        run: pnpm coverage:cards --download --out .coverage --update-baseline
      - name: Build the site
        run: >
          node tools/corpus/coverage-badge-cli.ts
          --baseline .coverage/coverage-baseline.json
          --reports .coverage
          --out .coverage-site
          --date "$(date -u +%Y-%m-%d)"
      - name: Show the report in the job summary
        run: cat .coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: .coverage
          retention-days: 90
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .coverage-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
