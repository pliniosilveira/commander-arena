name: Deck support triage

# D-251: a "deck support" issue opened or edited by anyone is checked for completeness by `pnpm corpus:check-issue`, with
# no model involved. A complete request (the one the import screen's "Ask for support on GitHub" button writes, with every
# card's data) gets the label `deck-support:ready`; an incomplete one gets one comment that lists what is missing, and loses
# the label. Only people with write access can add a label, so the label cannot be forged by an issue's author. The coding
# agent's `deck-support` skill takes the ready issues from there (`.claude/skills/deck-support/SKILL.md`).
# The description is untrusted input in a public repository: it goes through the environment into a file and is only ever
# read as data. The comment this workflow writes carries the sha256 of the description it checked, so the agent can tell
# whether the issue was edited after the check. A person other than the owner may have one request waiting at a time.
# D-290: what the work needs is the names of the unsupported cards and their card data. When the description has the names but no usable card data
# (a report pasted without the data block), this runner, which can reach Scryfall (the cloud session of the agent cannot), fetches the cards through the
# app's own Scryfall client, posts them as one comment of `github-actions[bot]` (marker `<!-- deck-support-card-data -->`, the sha256 of the description
# it was fetched for) and checks again: the data is Scryfall's, nothing in it comes from the author. The decklist, the template report and the build line
# are notes when missing, not reasons to refuse.
# D-292: the same check can be run by hand on an existing issue (Actions, "Deck support triage", Run workflow, the issue number), for an issue opened
# before this workflow existed or one whose last check ran under older rules. Only people with write access can start it. The issue is read through the
# API instead of the event, and what the author wrote still only ever goes into files, never into a script or the environment file.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: The number of the deck support issue to check again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deck-support-triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  triage:
    name: is the request complete?
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'deck support') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: A description that changed is not ready until it is checked again
        if: ${{ github.event.action == 'edited' && github.event.issue.user.login != github.repository_owner }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --remove-label deck-support:ready || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ inputs.issue }}
          EVENT_NUMBER: ${{ github.event.issue.number }}
          EVENT_AUTHOR: ${{ github.event.issue.user.login }}
          EVENT_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          # The description is data: it goes through the environment into a file, never into a script.
          BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_ISSUE" in
              ''|*[!0-9]*) echo "the issue must be a number"; exit 1 ;;
            esac
            gh api "repos/${GITHUB_REPOSITORY}/issues/${INPUT_ISSUE}" > "$RUNNER_TEMP/issue-api.json"
            jq -e '(.pull_request | not) and .state == "open" and (.title | ascii_downcase | startswith("deck support"))' "$RUNNER_TEMP/issue-api.json" > /dev/null \
              || { echo "#${INPUT_ISSUE} is not an open deck support issue"; exit 1; }
            jq -j '.body // ""' "$RUNNER_TEMP/issue-api.json" > "$RUNNER_TEMP/issue.md"
            jq -r '.number' "$RUNNER_TEMP/issue-api.json" > "$RUNNER_TEMP/number"
            jq -r '.user.login' "$RUNNER_TEMP/issue-api.json" > "$RUNNER_TEMP/author"
            jq -r '[.labels[].name] | join(",")' "$RUNNER_TEMP/issue-api.json" > "$RUNNER_TEMP/labels"
          else
            printf '%s' "$BODY" > "$RUNNER_TEMP/issue.md"
            printf '%s' "$EVENT_NUMBER" > "$RUNNER_TEMP/number"
            printf '%s' "$EVENT_AUTHOR" > "$RUNNER_TEMP/author"
            printf '%s' "$EVENT_LABELS" > "$RUNNER_TEMP/labels"
          fi
          echo "checking issue #$(cat "$RUNNER_TEMP/number") of $(cat "$RUNNER_TEMP/author")"
      - name: Check the description
        run: |
          code=0
          node tools/corpus/check-issue-cli.ts --body "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/result.json" || code=$?
          cat "$RUNNER_TEMP/result.json"
          # 0 complete, 1 incomplete; anything else is a failure of the check itself.
          test "$code" -le 1
      - name: Fetch the card data from Scryfall when that is all that is missing
        run: |
          if [ "$(jq -r .needsCardData "$RUNNER_TEMP/result.json")" != "true" ]; then
            echo "nothing to fetch"
            exit 0
          fi
          digest=$(sha256sum "$RUNNER_TEMP/issue.md" | cut -d' ' -f1)
          code=0
          node tools/corpus/fetch-card-data-cli.ts --body "$RUNNER_TEMP/issue.md" --out "$RUNNER_TEMP/card-data.md" --digest "$digest" > "$RUNNER_TEMP/fetch.json" || code=$?
          cat "$RUNNER_TEMP/fetch.json"
          # 0 fetched, 1 Scryfall could not give the cards; anything else is a failure of the tool itself.
          test "$code" -le 1
          if [ "$code" = 0 ]; then
            # The same check again, now with the fetched card data in place of the description's.
            code=0
            node tools/corpus/check-issue-cli.ts --body "$RUNNER_TEMP/issue.md" --card-data "$RUNNER_TEMP/card-data.md" > "$RUNNER_TEMP/result.json" || code=$?
            cat "$RUNNER_TEMP/result.json"
            test "$code" -le 1
          fi
      - name: Label and comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The issue number, its author and its labels were written to files by "Read the issue" (from the event or from the API).
          NUMBER=$(cat "$RUNNER_TEMP/number")
          LABELS=$(cat "$RUNNER_TEMP/labels")
          AUTHOR=$(cat "$RUNNER_TEMP/author")
          marker='<!-- deck-support-triage -->'
          case ",$LABELS," in
            *,deck-support:in-progress,*|*,deck-support:done,*|*,deck-support:blocked,*)
              echo "work on this issue already started or finished: nothing to do"
              exit 0 ;;
          esac
          digest=$(sha256sum "$RUNNER_TEMP/issue.md" | cut -d' ' -f1)
          marker="$marker<!-- sha256:$digest -->"
          # Someone other than the owner has one request waiting at a time.
          other=""
          if [ "$AUTHOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            other=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=deck-support:ready,deck-support:in-progress&per_page=100" \
              --jq "[.[] | select(.user.login == \"${AUTHOR}\" and .number != ${NUMBER})][0].number // empty" || true)
          fi
          if [ "$(jq -r .complete "$RUNNER_TEMP/result.json")" = "true" ] && [ -n "$other" ]; then
            gh issue edit "$NUMBER" --remove-label deck-support:ready || true
            body="$marker
          The request is complete, but #$other of yours is still waiting or being worked on. Only one request per person is queued at a time: edit this issue (any edit) when #$other is done, and it is checked again."
          elif [ "$(jq -r .complete "$RUNNER_TEMP/result.json")" = "true" ]; then
            # The card data this workflow fetched goes into its own comment first, so that a ready issue never lacks it (D-290).
            fetched_note=""
            if [ -s "$RUNNER_TEMP/card-data.md" ] && [ "$(jq -r .ok "$RUNNER_TEMP/fetch.json" 2>/dev/null)" = "true" ]; then
              data_existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- deck-support-card-data -->")))][0].id // empty')
              if [ -n "$data_existing" ]; then
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${data_existing}" -F body=@"$RUNNER_TEMP/card-data.md"
              else
                gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/card-data.md"
              fi
              fetched_note=" The card data was fetched from Scryfall by this workflow and is in the comment of github-actions that carries it."
            fi
            notes=$(jq -r '.notes[] | "- " + .' "$RUNNER_TEMP/result.json")
            notes_text=""
            if [ -n "$notes" ]; then
              notes_text="

          Not in the description. The unsupported cards can be built without it, but the deck as a whole cannot be checked:

          $notes"
            fi
            gh label create deck-support:ready --color 0E8A16 --description "A complete deck support request, waiting for the agent" --force
            gh issue edit "$NUMBER" --add-label deck-support:ready
            body="$marker
          The request is complete: the names of the $(jq '.unsupported | length' "$RUNNER_TEMP/result.json") unsupported cards and their card data.$fetched_note It is queued for the deck-support agent, which works when its budget allows.$notes_text"
          else
            gh issue edit "$NUMBER" --remove-label deck-support:ready || true
            fetch_problems=""
            if [ -s "$RUNNER_TEMP/fetch.json" ]; then
              fetch_problems=$(jq -r 'select(.ok == false) | .problems[] | "- " + .' "$RUNNER_TEMP/fetch.json" 2>/dev/null || true)
            fi
            body="$marker
          This deck support request is not complete yet, so it is not queued. What is missing:

          $(jq -r '.problems[] | "- " + .' "$RUNNER_TEMP/result.json")
          ${fetch_problems}

          Press **Ask for support on GitHub** on the import screen again, paste the whole report into the description, and edit this issue: it is checked again on every edit."
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --jq '[.[] | select(.body | contains("<!-- deck-support-triage -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body"
          else
            gh issue comment "$NUMBER" --body "$body"
          fi
