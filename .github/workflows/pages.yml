name: Deploy to GitHub Pages

# SPEC 17.6 A23, D-049: the playable build is deployed by Cloudflare's Git integration
# (`wrangler.jsonc`). This workflow is the GitHub Pages alternative, now that the repository is
# public: to use it, switch Settings -> Pages -> Source to "GitHub Actions" and add
# `push: branches: [main]` under `on:`. Until then it runs only when started by hand. A Pages site
# is one deployment: the weekly `Coverage report` (D-396) already publishes the coverage site
# there, so deploying the app here would replace it; put the coverage files in this build first.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @commander-arena/web build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
