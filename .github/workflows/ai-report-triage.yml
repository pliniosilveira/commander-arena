name: AI report triage

# Issue 627: a "That was a dumb move" issue (the game log's button writes the title "Dumb move: ..." and asks for the labels
# `ai-report` and `AI opponent`; GitHub keeps labels from a link only for people with write access, so the title counts too)
# is replayed by `node tools/ai/report.ts`, with no model involved, and gets one comment of github-actions with the result:
# whether the game replays to the reported AI decision, and the position from the AI seat, or why it does not.
# The description is untrusted input in a public repository: it goes through the environment into a file and is only ever
# read as data by the tool, which checks the replay against its schema and plays every action through the engine. Nothing of
# it reaches a shell. The comment carries the sha256 of the description it checked and is updated, not repeated, on an edit.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: ai-report-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: does the report replay?
    if: ${{ contains(github.event.issue.labels.*.name, 'ai-report') || startsWith(github.event.issue.title, 'Dumb move:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay the report
        env:
          # The description is data: it goes through the environment into a file, never into a script.
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/issue.md"
          code=0
          node tools/ai/report.ts --body "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/result.md" || code=$?
          cat "$RUNNER_TEMP/result.md"
          # 0 replays, 1 does not (the output says why); anything else is a failure of the tool itself.
          test "$code" -le 1
      - name: Label and comment
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create ai-report --color 5319E7 --description "A dumb move of the AI opponent, reported from the game" --force
          gh issue edit "$NUMBER" --add-label ai-report
          digest=$(sha256sum "$RUNNER_TEMP/issue.md" | cut -d' ' -f1)
          {
            printf '<!-- ai-report-triage --><!-- sha256:%s -->\n' "$digest"
            printf 'Checked with `node tools/ai/report.ts` on this commit of the repository.\n\n'
            cat "$RUNNER_TEMP/result.md"
            printf '\n\nThe check runs again on every edit of the description. A report without a replay block cannot be rebuilt: report the move again from the game log, and paste the whole report if the game asked you to.\n'
          } > "$RUNNER_TEMP/comment.md"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ai-report-triage -->")))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"$RUNNER_TEMP/comment.md"
          else
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          fi
