name: Full

# The complete suite as parallel jobs (the former CI): typecheck, lint, build, all unit tests
# in four shards (the AI soak tests of 20 games each included) and the browser tests. It runs every
# night on `main` and by hand (D-250). The scheduled run does not test again when no commit entered
# `main` since the last scheduled run (the `gate` job), and then repeats that run's result: green
# stays green, and a failure stays a failure (without a second issue), so the badge of the README
# shows red until a new commit passes. A run started by hand always runs. When a scheduled run
# that tested something fails, the `check` job opens an issue.

on:
  schedule:
    # 03:17 UTC every day, off the hour because GitHub delays jobs that start on it.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: new commits since the last scheduled run?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      last: ${{ steps.decide.outputs.last }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "last=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The head and the result of the last scheduled run that finished and was not cancelled, as "<sha> <result>". A scheduled run
          # starts from the tip of the default branch, so the same sha means no new commit. A run that did not test (nothing new) has the
          # result of the run before it, so the chain of results is kept.
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full.yml/runs?event=schedule&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == "success" or .conclusion == "failure")][0] | if . == null then "" else "\(.head_sha) \(.conclusion)" end')
          last_sha="${last%% *}"
          last_result="${last##* }"
          if [ -z "${last}" ]; then last_result=none; fi
          echo "this run: ${GITHUB_SHA}, last scheduled run: ${last_sha:-none} (${last_result})"
          echo "last=${last_result}" >> "$GITHUB_OUTPUT"
          if [ -n "${last_sha}" ] && [ "${last_sha}" = "${GITHUB_SHA}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  static:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  test:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run exhaustive tests and record timings
        env:
          VITEST_RESULTS_DIR: .test-results
        run: |
          # Without pipefail the step takes tee's exit code and a failing test never fails the job.
          set -o pipefail
          mkdir -p "$VITEST_RESULTS_DIR"
          pnpm exec vitest run \
            --shard=${{ matrix.shard }}/4 \
            --reporter=default \
            --reporter=json \
            --outputFile.json="$VITEST_RESULTS_DIR/vitest-results.json" \
            2>&1 | tee "$VITEST_RESULTS_DIR/vitest.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: full-test-results-${{ matrix.shard }}
          path: .test-results/
          if-no-files-found: warn
          retention-days: 30

  e2e:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    name: browser tests
    # Pinned: `ubuntu-latest` became Ubuntu 26.04 on 17 November, and `playwright install --with-deps chromium` stops there ("Playwright does not support chromium on
    # ubuntu26.04-x64"), so the browser tests did not run for three nights. Move it back to `ubuntu-latest` when the pinned Playwright supports the newer release.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @commander-arena/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  check:
    name: check
    if: ${{ always() }}
    needs: [gate, static, test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: every job passed (or nothing new to test)
        run: |
          echo "gate=${{ needs.gate.result }} run=${{ needs.gate.outputs.run }} last=${{ needs.gate.outputs.last }} static=${{ needs.static.result }} test=${{ needs.test.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.gate.result }}" = success
          if [ "${{ needs.gate.outputs.run }}" = "false" ]; then
            # Nothing new was tested, so this run has the result of the last one: a night after a failure on this very commit is still a failure.
            if [ "${{ needs.gate.outputs.last }}" = "failure" ]; then
              echo "no new commit since the last scheduled run, and that run failed: still failing (the issue of that run is open already)"
              exit 1
            fi
            echo "no new commit since the last scheduled run, and that run passed: nothing to test"
            exit 0
          fi
          test "${{ needs.static.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.e2e.result }}" = success
      - name: Open an issue when the nightly run failed
        # Not for a night that tested nothing and repeats an earlier failure (`run` is 'false'): that failure has its issue. A failed gate has no `run`, and does open one.
        if: ${{ failure() && github.event_name == 'schedule' && needs.gate.outputs.run != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Nightly full suite failed on ${GITHUB_SHA::7}" \
            --body "The scheduled Full run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed on ${{ github.sha }} (typecheck, lint and build: ${{ needs.static.result }}; unit tests: ${{ needs.test.result }}; browser tests: ${{ needs.e2e.result }})."
