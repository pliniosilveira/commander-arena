name: CI

# The quick CI (D-132): typecheck, lint, build, and the unit tests of the engine, cards, web app and
# tools, on every pull request and every push to `main`. It leaves out the AI soak tests and the
# browser tests, which take most of the time: the `Full` workflow runs them every night when `main`
# has a new commit (D-250), and by hand. The final job keeps the name `check`, so a branch
# protection rule that requires it keeps working.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  quick-tests:
    name: unit tests (no soak, no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/engine packages/cards apps/web tools

  check:
    name: check
    if: ${{ always() }}
    needs: [static, quick-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed
        run: |
          echo "static=${{ needs.static.result }} quick-tests=${{ needs.quick-tests.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.quick-tests.result }}" = success
