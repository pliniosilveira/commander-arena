name: CI

# The quick CI (D-132): typecheck, lint, build and the explicit PR unit tier on every pull request and
# every push to `main`. The test tier runs in four shards of about equal time, not equal file count
# (`tools/test/shard-sequencer.ts` reads the recorded times of `tools/test/shard-weights.json`; regenerate
# them from the uploaded `vitest.log` files with `node tools/test/shard-weights.ts`). It leaves out the listed AI game suites and
# browser tests; `Full` runs the
# exhaustive unit suite and browser tests every night when `main`
# has a new commit (D-250), and by hand. The final job keeps the name `check`, so a branch
# protection rule that requires it keeps working.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  quick-tests:
    name: unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run PR-tier tests and record timings
        env:
          VITEST_RESULTS_DIR: .test-results
        run: |
          # Without pipefail the step takes tee's exit code and a failing test never fails the job.
          set -o pipefail
          mkdir -p "$VITEST_RESULTS_DIR"
          pnpm test:pr -- --shard=${{ matrix.shard }}/4 2>&1 | tee "$VITEST_RESULTS_DIR/vitest.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pr-test-results-${{ matrix.shard }}
          path: .test-results/
          if-no-files-found: warn
          retention-days: 30

  check:
    name: check
    if: ${{ always() }}
    needs: [static, quick-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed
        run: |
          echo "static=${{ needs.static.result }} quick-tests=${{ needs.quick-tests.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.quick-tests.result }}" = success
