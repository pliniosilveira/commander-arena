name: Coverage

# SPEC 7.3: CI fails if card coverage drops. Runs the parser over Scryfall's oracle_cards bulk
# file and compares the supported counts with reports/coverage-baseline.json (D-090). The bulk
# file is cached for a day so a busy day downloads it once, as Scryfall asks of bulk clients.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: scryfall-oracle-cards-${{ steps.day.outputs.day }}
          restore-keys: scryfall-oracle-cards-
      - run: pnpm coverage:cards --download --check
