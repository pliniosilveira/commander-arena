name: Coverage

# SPEC 7.3: CI fails if card coverage drops. Runs the parser over Scryfall's oracle_cards bulk
# file and compares the supported counts with reports/coverage-baseline.json (D-090). The bulk
# file is cached for a day so a busy day downloads it once, as Scryfall asks of bulk clients.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      token_art:
        description: "Also audit token image searches from precons and the golden corpus (results in the log)"
        type: boolean
        default: false

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit token image searches
        if: github.event_name == 'workflow_dispatch' && inputs.token_art
        run: node tools/corpus/token-art-cli.ts
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/corpus
          key: scryfall-oracle-cards-${{ steps.day.outputs.day }}
          restore-keys: scryfall-oracle-cards-
      - run: pnpm coverage:cards --download --check
