name: Coverage

# SPEC 7.3: CI fails if card coverage drops. Runs the parser over Scryfall's oracle_cards bulk
# file and compares the supported counts with reports/coverage-baseline.json (D-090). The bulk
# file is cached for a day so a busy day downloads it once, as Scryfall asks of bulk clients.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      token_art:
        description: "Also audit token image searches from precons and the golden corpus (results in the log)"
        type: boolean
        default: false

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit token image searches
        if: github.event_name == 'workflow_dispatch' && inputs.token_art
        run: node tools/corpus/token-art-cli.ts
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/corpus
          key: scryfall-oracle-cards-${{ steps.day.outputs.day }}
          restore-keys: scryfall-oracle-cards-
      - run: pnpm coverage:cards --download --check
